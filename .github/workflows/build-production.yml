name: KASIRA Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      KASIRA_KEYSTORE_PASSWORD: ${{ secrets.KASIRA_KEYSTORE_PASSWORD }}
      KASIRA_KEYSTORE_ALIAS: ${{ secrets.KASIRA_KEYSTORE_ALIAS }}
      KASIRA_KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KASIRA_KEYSTORE_ALIAS_PASSWORD }}
      KASIRA_KEYSTORE_PATH: ${{ github.workspace }}/kasira-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Missing VITE_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$KASIRA_KEYSTORE_PASSWORD" || { echo "::error::Missing KASIRA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KASIRA_KEYSTORE_ALIAS" || { echo "::error::Missing KASIRA_KEYSTORE_ALIAS"; exit 1; }
          test -n "$KASIRA_KEYSTORE_ALIAS_PASSWORD" || { echo "::error::Missing KASIRA_KEYSTORE_ALIAS_PASSWORD"; exit 1; }
          test -n "${{ secrets.KASIRA_KEYSTORE_BASE64 }}" || { echo "::error::Missing KASIRA_KEYSTORE_BASE64"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Production source guard
        run: npm run check:production

      - name: Build production web
        run: npm run build

      - name: Decode Android signing key
        shell: bash
        run: |
          printf '%s' "${{ secrets.KASIRA_KEYSTORE_BASE64 }}" | base64 --decode > "$KASIRA_KEYSTORE_PATH"
          test -s "$KASIRA_KEYSTORE_PATH"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android SDK levels
        shell: bash
        run: |
          test -f android/variables.gradle || { echo "::error::Capacitor Android variables.gradle missing"; exit 1; }
          sed -i -E '/compileSdkVersion/s/[0-9]+$/36/' android/variables.gradle
          sed -i -E '/targetSdkVersion/s/[0-9]+$/36/' android/variables.gradle
          grep -E 'compileSdkVersion|targetSdkVersion' android/variables.gradle

      - name: Verify Android 16 target
        shell: bash
        run: |
          COMPILE=$(grep -E 'compileSdkVersion' android/variables.gradle | grep -oE '[0-9]+' | head -1)
          TARGET=$(grep -E 'targetSdkVersion' android/variables.gradle | grep -oE '[0-9]+' | head -1)
          echo "Detected compileSdkVersion=$COMPILE targetSdkVersion=$TARGET"
          test -n "$COMPILE" && test "$COMPILE" -ge 36 || { echo "::error::Android compileSdkVersion must be 36+"; exit 1; }
          test -n "$TARGET" && test "$TARGET" -ge 36 || { echo "::error::Android targetSdkVersion must be 36+"; exit 1; }

      - name: Build signed Android AAB
        shell: bash
        run: |
          npx cap build android --androidreleasetype AAB \
            --keystorepath "$KASIRA_KEYSTORE_PATH" \
            --keystorepass "$KASIRA_KEYSTORE_PASSWORD" \
            --keystorealias "$KASIRA_KEYSTORE_ALIAS" \
            --keystorealiaspass "$KASIRA_KEYSTORE_ALIAS_PASSWORD"

      - name: Build signed Android APK
        shell: bash
        run: |
          npx cap build android --androidreleasetype APK --signing-type apksigner \
            --keystorepath "$KASIRA_KEYSTORE_PATH" \
            --keystorepass "$KASIRA_KEYSTORE_PASSWORD" \
            --keystorealias "$KASIRA_KEYSTORE_ALIAS" \
            --keystorealiaspass "$KASIRA_KEYSTORE_ALIAS_PASSWORD"

      - name: Verify release artifacts are signed
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$AAB" || { echo "::error::Release AAB missing"; exit 1; }
          test -s "$APK" || { echo "::error::Release APK missing"; exit 1; }
          jarsigner -verify "$AAB" >/tmp/aab-verify.txt
          grep -q "jar verified" /tmp/aab-verify.txt || { cat /tmp/aab-verify.txt; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "::error::apksigner unavailable"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" >/tmp/apk-verify.txt
          grep -Eq 'Verified using v[123] scheme.*true' /tmp/apk-verify.txt || { cat /tmp/apk-verify.txt; exit 1; }
          grep -q "Signer #" /tmp/apk-verify.txt
          echo "Release AAB and APK signature checks passed."

      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: KASIRA-Production-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: KASIRA-Production-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
