name: KASIRA Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      KASIRA_KEYSTORE_PASSWORD: ${{ secrets.KASIRA_KEYSTORE_PASSWORD }}
      KASIRA_KEYSTORE_ALIAS: ${{ secrets.KASIRA_KEYSTORE_ALIAS }}
      KASIRA_KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KASIRA_KEYSTORE_ALIAS_PASSWORD }}
      KASIRA_KEYSTORE_PATH: ${{ github.workspace }}/kasira-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Missing VITE_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$KASIRA_KEYSTORE_PASSWORD" || { echo "::error::Missing KASIRA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KASIRA_KEYSTORE_ALIAS" || { echo "::error::Missing KASIRA_KEYSTORE_ALIAS"; exit 1; }
          test -n "$KASIRA_KEYSTORE_ALIAS_PASSWORD" || { echo "::error::Missing KASIRA_KEYSTORE_ALIAS_PASSWORD"; exit 1; }
          test -n "${{ secrets.KASIRA_KEYSTORE_BASE64 }}" || { echo "::error::Missing KASIRA_KEYSTORE_BASE64"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Production source guard
        run: npm run check:production

      - name: Build production web
        run: npm run build

      - name: Decode Android signing key
        shell: bash
        run: echo "${{ secrets.KASIRA_KEYSTORE_BASE64 }}" | base64 --decode > "$KASIRA_KEYSTORE_PATH"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed Android AAB
        run: npx cap build android

      - name: Build signed Android APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release artifacts
        shell: bash
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          test -f android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab >/tmp/aab-verify.txt
          grep -q "jar verified" /tmp/aab-verify.txt

      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: KASIRA-Production-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: KASIRA-Production-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
