name: Build KASIRA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies reproducibly
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --package-lock-only --ignore-scripts && npm ci; fi

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android 16 target
        run: |
          test -f android/variables.gradle || { echo "::error::Capacitor Android variables.gradle missing"; exit 1; }
          TARGET=$(grep -E 'targetSdkVersion' android/variables.gradle | grep -oE '[0-9]+' | head -1)
          echo "Detected targetSdkVersion=$TARGET"
          test -n "$TARGET" && test "$TARGET" -ge 36 || { echo "::error::Google Play requires targetSdk 36+ for new apps/updates"; exit 1; }

      # Debug builds are automatically signed with Android's debug keystore,
      # so the resulting APK can be installed directly on a test device.
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          echo "Generated APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KASIRA-Android-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 6
