name: Build KASIRA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies reproducibly
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --package-lock-only --ignore-scripts && npm ci; fi

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Build web
        env:
          VITE_SUPABASE_URL: https://clylvxgilwywwkxngmnv.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_SMiSLDgxyAxzFhSPq_n6OQ_xf-FZPYw
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply KASIRA launcher logo
        run: |
          npm install --no-save --package-lock=false sharp
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir, rm } from 'node:fs/promises';
          const svg = 'public/kasira-icon.svg';
          const densities = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          for (const [density, size] of Object.entries(densities)) {
            const dir = `android/app/src/main/res/mipmap-${density}`;
            await mkdir(dir, { recursive: true });
            const png = await sharp(svg).resize(size, size).png().toBuffer();
            await sharp(png).toFile(`${dir}/ic_launcher.png`);
            await sharp(png).toFile(`${dir}/ic_launcher_round.png`);
          }
          // Prefer the new branded density assets over Capacitor's template adaptive icon.
          await rm('android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml', { force: true });
          await rm('android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml', { force: true });
          console.log('KASIRA launcher icons generated for all Android density buckets.');
          NODE

      - name: Set Android SDK 36 and verify
        run: |
          test -f android/variables.gradle || { echo "::error::Capacitor Android variables.gradle missing"; exit 1; }
          sed -i -E '/compileSdkVersion/s/[0-9]+$/36/' android/variables.gradle
          sed -i -E '/targetSdkVersion/s/[0-9]+$/36/' android/variables.gradle
          grep -E 'compileSdkVersion|targetSdkVersion' android/variables.gradle
          COMPILE=$(grep -E 'compileSdkVersion' android/variables.gradle | grep -oE '[0-9]+' | head -1)
          TARGET=$(grep -E 'targetSdkVersion' android/variables.gradle | grep -oE '[0-9]+' | head -1)
          echo "Detected compileSdkVersion=$COMPILE targetSdkVersion=$TARGET"
          test -n "$COMPILE" && test "$COMPILE" -ge 36 || { echo "::error::compileSdkVersion must be 36+"; exit 1; }
          test -n "$TARGET" && test "$TARGET" -ge 36 || { echo "::error::targetSdkVersion must be 36+"; exit 1; }

      # Debug builds are automatically signed with Android's debug keystore,
      # so the resulting APK can be installed directly on a test device.
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          echo "Generated APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KASIRA-Android-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 6
