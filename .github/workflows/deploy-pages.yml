name: KASIRA GitHub Pages

on:
  push:
    branches:
      - deploy/kasira-github-pages

permissions:
  contents: read

concurrency:
  group: kasira-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /KOMPRISMA-KASIR-V3/
      VITE_PUBLIC_APP_URL: https://komprisma-ui.github.io/KOMPRISMA-KASIR-V3/
      VITE_SUPABASE_URL: https://clylvxgilwywwkxngmnv.supabase.co
      # This is the Supabase publishable client key, not a service-role secret.
      VITE_SUPABASE_ANON_KEY: sb_publishable_SMiSLDgxyAxzFhSPq_n6OQ_xf-FZPYw
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run production checks and build
        run: npm test

      - name: Prepare GitHub Pages output
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
